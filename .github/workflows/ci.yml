name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Synthetic regression suite
        run: python3 -m unittest discover -s tests/security -v
      - name: Privacy scan (tracked text, counts only)
        run: python3 -I src/repo_checks/privacy.py
      - name: Privacy scope summary
        if: always()
        run: |
          printf "%s\n" "## Privacy scan" "- Scanned tracked UTF8 text for phone/email/ID/secret patterns and sensitive filenames." "- Counts only, no finding values or paths in public logs." "- Binary files require separate review; this is not privacy certification." >> "$GITHUB_STEP_SUMMARY"
      - name: Check own workflow
        run: python3 src/repo_checks/scorecard.py
