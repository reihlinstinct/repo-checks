name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Synthetic regression suite
        run: python3 -m unittest discover -s tests/security -v
      - name: Check own workflow
        run: python3 src/repo_checks/scorecard.py
