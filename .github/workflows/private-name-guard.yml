name: Trusted private name guard
on:
  workflow_call:
    secrets:
      PRIVATE_NAME_TERMS_JSON:
        required: true
permissions: {}
jobs:
  bind:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      actions: read
    outputs:
      sha: ${{ steps.bind.outputs.sha }}
      source-success: ${{ steps.bind.outputs.source-success }}
      same-repository: ${{ steps.bind.outputs.same-repository }}
      run-id: ${{ steps.bind.outputs.run-id }}
    steps:
      - id: bind
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const event = context.payload;
            const candidate = event.workflow_run;
            if (context.eventName !== 'workflow_run' || !candidate || event.repository?.private !== false ||
                candidate.event !== 'pull_request' || candidate.status !== 'completed' ||
                !Number.isSafeInteger(candidate.id) || !Number.isSafeInteger(candidate.head_repository?.id) || !/^[0-9a-f]{40}$/.test(candidate.head_sha || '')) {
              throw new Error('Invalid scan request');
            }
            const {data: run} = await github.rest.actions.getWorkflowRun({...context.repo, run_id: candidate.id});
            if (run.id !== candidate.id || run.repository?.id !== event.repository.id ||
                run.head_repository?.id !== candidate.head_repository?.id || run.event !== 'pull_request' ||
                run.path !== '.github/workflows/privacy-request.yml' || run.status !== 'completed' ||
                run.head_sha !== candidate.head_sha || run.conclusion !== candidate.conclusion) {
              throw new Error('Unbound scan request');
            }
            core.setOutput('run-id', String(run.id));
            core.setOutput('same-repository', run.head_repository?.id === event.repository.id ? 'true' : 'false');
            core.setOutput('sha', run.head_sha);
            core.setOutput('source-success', run.conclusion === 'success' ? 'true' : 'false');
  scan:
    needs: bind
    if: needs.bind.outputs.same-repository == 'true' && needs.bind.outputs.source-success == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: privacy-policy
    permissions:
      contents: read
    steps:
      - name: Fetch exact public candidate as inert data
        env:
          CANDIDATE_SHA: ${{ needs.bind.outputs.sha }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$GITHUB_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || exit 1
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0
          export GIT_CONFIG_COUNT=3
          export GIT_CONFIG_KEY_0=core.hooksPath GIT_CONFIG_VALUE_0=/dev/null
          export GIT_CONFIG_KEY_1=core.fsmonitor GIT_CONFIG_VALUE_1=false
          export GIT_CONFIG_KEY_2=protocol.file.allow GIT_CONFIG_VALUE_2=never
          root="$GITHUB_WORKSPACE/candidate"
          mkdir "$root"
          git init -q "$root" >/dev/null 2>&1
          git -C "$root" fetch --quiet --depth=1 --no-tags "https://github.com/$GITHUB_REPOSITORY.git" "$CANDIDATE_SHA" >/dev/null 2>&1
          git -C "$root" checkout --quiet --detach FETCH_HEAD >/dev/null 2>&1
          [[ "$(git -C "$root" rev-parse HEAD)" == "$CANDIDATE_SHA" ]]
          [[ -z "$(git -C "$root" status --porcelain=v1 --untracked-files=all)" ]]
      - name: Secret-sourced private-name scan
        uses: reihlinstinct/repo-checks/actions/private-names@52293de5de6c2257b531e36a24eb2be61d80d509
        with:
          checkout-root: ${{ github.workspace }}/candidate
        env:
          PRIVATE_NAME_TERMS_JSON: ${{ secrets.PRIVATE_NAME_TERMS_JSON }}
      - name: Generic privacy scan (counts-only findings remain non-blocking)
        id: generic
        if: always()
        continue-on-error: true
        uses: reihlinstinct/repo-checks/actions/privacy@52293de5de6c2257b531e36a24eb2be61d80d509
        with:
          checkout-root: ${{ github.workspace }}/candidate
      - name: Reject generic scanner errors, not existing synthetic findings
        if: always()
        env:
          GENERIC_RESULT: ${{ steps.generic.outputs.result }}
          GENERIC_OUTCOME: ${{ steps.generic.outcome }}
        run: |
          python3 -I - <<'PYTHON'
          import json, os
          try:
              record = json.loads(os.environ['GENERIC_RESULT'])
              state = record['status']
              outcome = os.environ['GENERIC_OUTCOME']
              assert state in {'pass', 'findings'}
              assert outcome == {'pass': 'success', 'findings': 'failure'}[state]
          except Exception:
              print('Generic privacy scanner unavailable or failed')
              raise SystemExit(1)
          print('Generic privacy scan completed; counts-only findings remain non-blocking')
          PYTHON
  report:
    needs: [bind, scan]
    if: always() && needs.bind.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      statuses: write
      actions: read
    steps:
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          CANDIDATE_SHA: ${{ needs.bind.outputs.sha }}
          SOURCE_RUN_ID: ${{ needs.bind.outputs.run-id }}
          SAME_REPOSITORY: ${{ needs.bind.outputs.same-repository }}
          SOURCE_SUCCESS: ${{ needs.bind.outputs.source-success }}
          SCAN_RESULT: ${{ needs.scan.result }}
        with:
          script: |
            const sha = process.env.CANDIDATE_SHA;
            if (!/^[0-9a-f]{40}$/.test(sha || '')) throw new Error('Invalid candidate SHA');
            const id = Number(process.env.SOURCE_RUN_ID);
            if (!Number.isSafeInteger(id) || id <= 0) throw new Error('Invalid source run');
            const {data: run} = await github.rest.actions.getWorkflowRun({...context.repo, run_id: id});
            if (run.id !== id || run.repository?.id !== context.payload.repository.id ||
                run.event !== 'pull_request' || run.path !== '.github/workflows/privacy-request.yml' ||
                run.status !== 'completed' || run.head_sha !== sha) throw new Error('Unbound status request');
            const clean = process.env.SCAN_RESULT === 'success' && process.env.SOURCE_SUCCESS === 'true' &&
              process.env.SAME_REPOSITORY === 'true' && run.head_repository?.id === run.repository.id &&
              run.conclusion === 'success';
            await github.rest.repos.createCommitStatus({...context.repo, sha,
              state: clean ? 'success' : 'failure', context: 'private-name-guard',
              description: clean ? 'Trusted privacy scan passed' : 'Trusted privacy scan failed or unavailable',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});
