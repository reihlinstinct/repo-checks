name: Accessibility action regression
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  a11y:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.0'
          package-manager-cache: false
      - name: Locked tooling
        working-directory: actions/a11y
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install playwright install --with-deps chromium webkit
      - name: Synthetic positive and negative matrix
        working-directory: actions/a11y
        run: npm test
      - name: Scope summary
        if: always()
        run: |
          printf '%s\n' '## Accessibility' 'Synthetic axe action regression suite: Chromium + WebKit, desktop + mobile.' 'Pass is automated-only, never SI 5568 certification. Manual checks remain required.' >> "$GITHUB_STEP_SUMMARY"
