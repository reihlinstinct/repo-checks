name: Local preview accessibility
description: Pinned axe WCAG A/AA browser matrix; content-free reports, not conformance certification.
inputs:
  base-url:
    description: Local HTTP preview origin (localhost or 127.0.0.1), without a path.
    required: true
  browser-runtime:
    description: "install (default), or preinstalled in a reviewed version-matched runtime; both fail on browser errors."
    required: false
    default: install
  config:
    description: Absolute path to reviewed version1 JSON route manifest.
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '22.23.0'
        package-manager-cache: false
    - name: Install locked free browser tools
      shell: bash
      env:
        TRUSTED_ACTION: ${{ github.action_path }}
        BROWSER_RUNTIME: ${{ inputs.browser-runtime }}
      run: |
        case "$BROWSER_RUNTIME" in install|preinstalled) ;; *) echo "Invalid browser runtime"; exit 2 ;; esac
        cd "$TRUSTED_ACTION"
        npm ci --ignore-scripts --no-audit --no-fund
        if [ "$BROWSER_RUNTIME" = install ]; then
          npx --no-install playwright install --with-deps chromium webkit
        fi
        node runtime.mjs
    - name: Check local preview
      shell: bash
      env:
        TRUSTED_ACTION: ${{ github.action_path }}
        A11Y_BASE_URL: ${{ inputs.base-url }}
        A11Y_CONFIG: ${{ inputs.config }}
      run: node "$TRUSTED_ACTION/scan.mjs"
