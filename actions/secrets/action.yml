name: Blocking secret-only text guard
description: Blocks recognized token/private-key patterns in bounded tracked UTF-8 text. Binary content is not certified.
inputs:
  checkout-root:
    description: Absolute candidate checkout path within GITHUB_WORKSPACE.
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        CHECK_ROOT: ${{ inputs.checkout-root }}
        TRUSTED_ACTION: ${{ github.action_path }}
      run: python3 -I "$TRUSTED_ACTION/bootstrap.py"
