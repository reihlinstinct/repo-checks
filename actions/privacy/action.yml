name: Bounded privacy guard
description: Counts-only offline tracked-text privacy scan from pinned trusted code.
inputs:
  checkout-root:
    description: Absolute caller checkout path within GITHUB_WORKSPACE.
    required: true
outputs:
  result:
    description: Validated fixed-schema counts-only result, no finding values or paths.
    value: ${{ steps.check.outputs.result }}
runs:
  using: composite
  steps:
    - id: check
      shell: bash
      env:
        CHECK_ROOT: ${{ inputs.checkout-root }}
        TRUSTED_ACTION: ${{ github.action_path }}
      run: python3 -I "$TRUSTED_ACTION/bootstrap.py"
